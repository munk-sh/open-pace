name: ios

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: ios
    runs-on: macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install
        run: |
          set -euo pipefail

          if ! command -v xcodegen >/dev/null 2>&1; then
            echo "install: 安装 xcodegen"
            brew install xcodegen
          fi
          xcodegen --version

          runtime_ready() {
            xcrun simctl list runtimes | grep -Eq '^iOS 18\.6( |$)'
          }

          if ! runtime_ready; then
            echo "install: 下载 iOS 18.6 模拟器运行时"
            if ! xcodebuild -downloadPlatform iOS -buildVersion 18.6; then
              echo "install: 直接下载失败，改用 sudo 重试"
              sudo xcodebuild -downloadPlatform iOS -buildVersion 18.6
            fi
          fi

          for _ in $(seq 1 120); do
            if runtime_ready; then
              break
            fi
            sleep 5
          done

          if ! runtime_ready; then
            echo "install: 未能获得 iOS 18.6 模拟器运行时，无法满足 destination 契约" >&2
            exit 1
          fi

          device_ready() {
            xcrun simctl list devices available 'iOS 18.6' 2>/dev/null | grep -Eq '^[[:space:]]+iPhone 16 \('
          }

          if ! device_ready; then
            echo "install: 创建 iPhone 16 (iOS 18.6) 模拟器"
            runtime_id="$(xcrun simctl list runtimes | awk '/^iOS 18\.6 /{print $NF; exit}')"
            xcrun simctl create "iPhone 16" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$runtime_id"
          fi

          for _ in $(seq 1 60); do
            if device_ready; then
              break
            fi
            sleep 2
          done

          device_ready

      - name: drift
        run: |
          set -euo pipefail

          spec="ios/project.yml"
          project="ios/PurePace.xcodeproj"
          scheme="${project}/xcshareddata/xcschemes/PurePace.xcscheme"

          # 断言 1：工程必须能完全由 spec 重建（生成失败即非零退出）。
          rm -rf "${project}"
          xcodegen generate --spec "${spec}" --project ios

          # 断言 2：索引事实——pbxproj 一律不入库。
          # ignored 文件上的 git diff 恒为空，不能当断言；这里只看 git ls-files。
          tracked_pbxproj="$(git ls-files | grep -F 'project.pbxproj' || true)"
          if [ -n "${tracked_pbxproj}" ]; then
            echo "drift: git 索引仍跟踪 project.pbxproj：" >&2
            printf '%s\n' "${tracked_pbxproj}" >&2
            exit 1
          fi

          # 断言 3：shared scheme 由 spec 生成，且 xcodebuild 可见。
          if [ ! -s "${scheme}" ]; then
            echo "drift: 生成后缺少非空 shared scheme ${scheme}" >&2
            exit 1
          fi
          scheme_list="$(xcodebuild -list -project "${project}")"
          scheme_names="$(printf '%s\n' "${scheme_list}" | sed -n '/Schemes:/,$p')"
          case "${scheme_names}" in
            *PurePace*)
              ;;
            *)
              echo "drift: xcodebuild -list 的 Schemes 段未列出 PurePace" >&2
              exit 1
              ;;
          esac

          echo "drift: xcodegen 生成成功；git ls-files 无 project.pbxproj；PurePace scheme 可见"

      - name: lint
        run: |
          bash scripts/check-baseline.sh
          bash scripts/check-ios-core.sh
          bash scripts/check-ios-scripts.sh
          bash scripts/check-ios-shell.sh

      - name: test
        timeout-minutes: 45
        run: |
          set -euo pipefail

          log_dir=".build/ci"
          mkdir -p "${log_dir}"
          log_abs_dir="${GITHUB_WORKSPACE:-${PWD}}/${log_dir}"
          echo "test: attempt 日志绝对路径 ${log_abs_dir}/test-ios-attempt1.log 与 ${log_abs_dir}/test-ios-attempt2.log"

          # step 级预算（2700s）与 step 起始 epoch 秒：供 scripts/test-ios.sh 算 UI 可用预算，
          # 也供本步在重试前判断剩余预算是否还够跑完一轮。
          export PUREPACE_IOS_TEST_STEP_BUDGET_SECONDS="${PUREPACE_IOS_TEST_STEP_BUDGET_SECONDS:-2700}"
          export PUREPACE_IOS_STEP_STARTED_AT="$(date +%s)"

          run_attempt() {
            attempt="$1"
            log_file="$2"
            rc=0
            : >"${log_file}"
            if bash scripts/test-ios.sh 2>&1 | tee -a "${log_file}"; then
              rc=0
            else
              rc=$?
            fi
            echo "test: 第 ${attempt} 次 scripts/test-ios.sh 退出 ${rc}（完整日志 ${log_file}）"
            return "$rc"
          }

          # 仅 GitHub 承载层不稳定允许有界重试，产品级断言失败不重试。
          # runner 实测出现的同族原文（Xcode 版本不同措辞不同）：
          #   Timed out while loading Accessibility.
          #   Failed to initialize for UI testing / Timed out waiting for AX loaded notification
          #   unknown to FrontBoard
          #   PurePaceUITests-Runner ... Early unexpected exit, operation never finished
          #   bootstrapping（Test crashed with signal abrt while preparing to run tests）
          #   runner bootstrap 挂起（scripts/test-ios.sh 600s 看门狗在进入产品断言前硬超时）
          infra_pattern='Timed out while loading Accessibility\.|unknown to FrontBoard|Timed out waiting for AX loaded notification|Failed to initialize for UI testing|operation never finished bootstrapping|while preparing to run tests|runner bootstrap 挂起'
          infra_unstable() {
            grep -Eq "$infra_pattern" "$1"
          }

          reset_simulator() {
            echo "test: 重试前关闭模拟器，交由 test-ios.sh 重新 bootstatus + 安装 + 授权"
            xcrun simctl shutdown all >/dev/null 2>&1 || true
          }

          # step 剩余预算（秒）；两个 env 任一缺失/非法时不约束（输出空串）。
          step_budget_left() {
            case "${PUREPACE_IOS_TEST_STEP_BUDGET_SECONDS:-}" in
              ""|*[!0-9]*) return 0 ;;
            esac
            case "${PUREPACE_IOS_STEP_STARTED_AT:-}" in
              ""|*[!0-9]*) return 0 ;;
            esac
            local elapsed remaining
            elapsed=$(( $(date +%s) - PUREPACE_IOS_STEP_STARTED_AT ))
            if [ "${elapsed}" -lt 0 ]; then
              elapsed=0
            fi
            remaining=$(( PUREPACE_IOS_TEST_STEP_BUDGET_SECONDS - elapsed ))
            if [ "${remaining}" -lt 0 ]; then
              remaining=0
            fi
            printf '%s' "${remaining}"
          }

          rc=0
          run_attempt 1 "$log_dir/test-ios-attempt1.log" || rc=$?
          if [ "$rc" -ne 0 ]; then
            if grep -Fq -- 'blocked:' "$log_dir/test-ios-attempt1.log"; then
              echo "test: scripts/test-ios.sh 走了 blocked: 降级分支，CI 判失败" >&2
              exit 1
            fi
            if infra_unstable "$log_dir/test-ios-attempt1.log"; then
              # 重试前算 step 剩余预算：两个 env 都在且剩余 < 900s 时不再起跑 attempt2。
              remaining_step="$(step_budget_left)"
              if [ -n "${remaining_step}" ] && [ "${remaining_step}" -lt 900 ]; then
                echo "test-ios: 跳过重试，剩余 step 预算不足以跑完一轮"
                exit "$rc"
              fi
              echo "test: 首次失败命中 GitHub 承载层不稳定特征，重置模拟器后有界重试 1 次" >&2
              echo "test: 首次失败原因原文：" >&2
              grep -Eo "$infra_pattern" "$log_dir/test-ios-attempt1.log" | head -n 1 >&2 || true
              reset_simulator
              rc=0
              run_attempt 2 "$log_dir/test-ios-attempt2.log" || rc=$?
            else
              echo "test: 非承载层不稳定的失败（产品/脚本断言），不重试" >&2
            fi
          fi
          exit "$rc"

      - name: test-logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-attempt-logs
          path: |
            .build/ci/test-ios-attempt1.log
            .build/ci/test-ios-attempt2.log
          if-no-files-found: ignore
          retention-days: 3

      - name: build
        run: |
          set -euo pipefail
          if output="$(bash scripts/build-ios.sh 2>&1)"; then
            step_rc=0
          else
            step_rc=$?
          fi
          printf '%s\n' "$output"
          case "$output" in
            *blocked:*)
              echo "build: scripts/build-ios.sh 走了 blocked: 降级分支，CI 判失败" >&2
              exit 1
              ;;
          esac
          exit "$step_rc"
