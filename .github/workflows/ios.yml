name: ios

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: ios
    runs-on: macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install
        run: |
          set -euo pipefail

          if ! command -v xcodegen >/dev/null 2>&1; then
            echo "install: 安装 xcodegen"
            brew install xcodegen
          fi
          xcodegen --version

          runtime_ready() {
            xcrun simctl list runtimes | grep -Eq '^iOS 18\.6( |$)'
          }

          if ! runtime_ready; then
            echo "install: 下载 iOS 18.6 模拟器运行时"
            if ! xcodebuild -downloadPlatform iOS -buildVersion 18.6; then
              echo "install: 直接下载失败，改用 sudo 重试"
              sudo xcodebuild -downloadPlatform iOS -buildVersion 18.6
            fi
          fi

          for _ in $(seq 1 120); do
            if runtime_ready; then
              break
            fi
            sleep 5
          done

          if ! runtime_ready; then
            echo "install: 未能获得 iOS 18.6 模拟器运行时，无法满足 destination 契约" >&2
            exit 1
          fi

          device_ready() {
            xcrun simctl list devices available 'iOS 18.6' 2>/dev/null | grep -Eq '^[[:space:]]+iPhone 16 \('
          }

          if ! device_ready; then
            echo "install: 创建 iPhone 16 (iOS 18.6) 模拟器"
            runtime_id="$(xcrun simctl list runtimes | awk '/^iOS 18\.6 /{print $NF; exit}')"
            xcrun simctl create "iPhone 16" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$runtime_id"
          fi

          for _ in $(seq 1 60); do
            if device_ready; then
              break
            fi
            sleep 2
          done

          device_ready

      - name: lint
        run: |
          bash scripts/check-baseline.sh
          bash scripts/check-ios-core.sh
          bash scripts/check-ios-scripts.sh
          bash scripts/check-ios-shell.sh

      - name: test
        timeout-minutes: 45
        run: |
          set -euo pipefail

          log_dir=".build/ci"
          mkdir -p "$log_dir"

          run_attempt() {
            attempt="$1"
            log_file="$2"
            rc=0
            if bash scripts/test-ios.sh >"$log_file" 2>&1; then
              rc=0
            else
              rc=$?
            fi
            echo "test: 第 ${attempt} 次 scripts/test-ios.sh 退出 ${rc}（完整日志 ${log_file}）"
            cat "$log_file"
            return "$rc"
          }

          # 仅 GitHub 承载层不稳定允许有界重试，产品级断言失败不重试。
          # runner 实测出现的同族原文（Xcode 版本不同措辞不同）：
          #   Timed out while loading Accessibility.
          #   Failed to initialize for UI testing / Timed out waiting for AX loaded notification
          #   unknown to FrontBoard
          #   PurePaceUITests-Runner ... Early unexpected exit, operation never finished
          #   bootstrapping（Test crashed with signal abrt while preparing to run tests）
          #   runner bootstrap 挂起（scripts/test-ios.sh 600s 看门狗在进入产品断言前硬超时）
          infra_pattern='Timed out while loading Accessibility\.|unknown to FrontBoard|Timed out waiting for AX loaded notification|Failed to initialize for UI testing|operation never finished bootstrapping|while preparing to run tests|runner bootstrap 挂起'
          infra_unstable() {
            grep -Eq "$infra_pattern" "$1"
          }

          reset_simulator() {
            echo "test: 重试前关闭模拟器，交由 test-ios.sh 重新 bootstatus + 安装 + 授权"
            xcrun simctl shutdown all >/dev/null 2>&1 || true
          }

          rc=0
          run_attempt 1 "$log_dir/test-ios-attempt1.log" || rc=$?
          if [ "$rc" -ne 0 ]; then
            if grep -Fq -- 'blocked:' "$log_dir/test-ios-attempt1.log"; then
              echo "test: scripts/test-ios.sh 走了 blocked: 降级分支，CI 判失败" >&2
              exit 1
            fi
            if infra_unstable "$log_dir/test-ios-attempt1.log"; then
              echo "test: 首次失败命中 GitHub 承载层不稳定特征，重置模拟器后有界重试 1 次" >&2
              echo "test: 首次失败原因原文：" >&2
              grep -Eo "$infra_pattern" "$log_dir/test-ios-attempt1.log" | head -n 1 >&2 || true
              reset_simulator
              rc=0
              run_attempt 2 "$log_dir/test-ios-attempt2.log" || rc=$?
            else
              echo "test: 非承载层不稳定的失败（产品/脚本断言），不重试" >&2
            fi
          fi
          exit "$rc"

      - name: build
        run: |
          set -euo pipefail
          if output="$(bash scripts/build-ios.sh 2>&1)"; then
            step_rc=0
          else
            step_rc=$?
          fi
          printf '%s\n' "$output"
          case "$output" in
            *blocked:*)
              echo "build: scripts/build-ios.sh 走了 blocked: 降级分支，CI 判失败" >&2
              exit 1
              ;;
          esac
          exit "$step_rc"
