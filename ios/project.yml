# PurePace iOS 工程唯一真源（XcodeGen）。
# 生成物：ios/PurePace.xcodeproj —— 禁止手写 project.pbxproj。
# 版本号来自根 VERSION：由 scripts/sync-ios-version.sh 生成 Config/Version.xcconfig，
# 本文件与 App 源码都不出现版本字面值。
name: PurePace

options:
  minimumXcodeGenVersion: "2.46.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig

packages:
  # 唯一允许的依赖：仓库内本地 path package（相对 spec 目录），无远程/第三方。
  PurePaceRunCore:
    path: RunCore

settings:
  base:
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    PUREPACE_BUNDLE_ID: com.chaxiu.purepace
    PRODUCT_BUNDLE_IDENTIFIER: $(PUREPACE_BUNDLE_ID)

targets:
  PurePace:
    type: application
    platform: iOS
    sources:
      - path: PurePace
    # 基础 Info.plist 只承载 Xcode 生成器不支持的数组键（UIBackgroundModes）；
    # 其余键仍走 INFOPLIST_KEY_* 与 GENERATE_INFOPLIST_FILE 合并生成。
    info:
      path: PurePace/Info.plist
      properties:
        UIBackgroundModes:
          - location
    settings:
      base:
        PRODUCT_NAME: PurePace
        INFOPLIST_KEY_CFBundleDisplayName: PurePace
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # 定位用途说明与后台定位模式仅为配置声明；真机后台行为不在代码层承诺范围内。
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "PurePace 在跑步过程中使用定位来记录路线、距离与配速。"
        INFOPLIST_KEY_UIBackgroundModes: location
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: PurePaceRunCore
        product: PurePaceRunCore

  PurePaceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PurePaceTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PUREPACE_BUNDLE_ID).tests
    dependencies:
      - target: PurePace
      # 显式声明，避免依赖 App target 的传递可见性（Swift 6 下更稳）。
      - package: PurePaceRunCore
        product: PurePaceRunCore

  PurePaceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PurePaceUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PUREPACE_BUNDLE_ID).uitests
        TEST_TARGET_NAME: PurePace
    dependencies:
      - target: PurePace

schemes:
  PurePace:
    build:
      targets:
        PurePace: all
        PurePaceTests: [test]
        PurePaceUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: PurePaceTests
        - name: PurePaceUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
